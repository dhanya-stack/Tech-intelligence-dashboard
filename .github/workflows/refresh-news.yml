name: Refresh semiconductor & AI news

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:30 UTC = 07:00 IST.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public news feed
        run: python scripts/update_news.py
      - name: Commit refreshed feed
        run: |
          git config user.name "semi-ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Daily news refresh"
          git push
